<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Camera placeholder">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#111c33"/>
            <stop offset="55%" stop-color="#0b1322"/>
            <stop offset="100%" stop-color="#05080f"/>
        </linearGradient>
        <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#15233d"/>
            <stop offset="100%" stop-color="#080d17"/>
        </linearGradient>
        <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
            <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
        </radialGradient>
        <filter id="grain">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
            <feColorMatrix type="saturate" values="0"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.08"/>
            </feComponentTransfer>
        </filter>
    </defs>

    <rect width="640" height="360" fill="url(#bg)"/>

    <!-- ceiling light strips -->
    <rect x="120" y="34" width="160" height="6" rx="3" fill="#8fb8ff" opacity="0.35"/>
    <rect x="360" y="34" width="160" height="6" rx="3" fill="#8fb8ff" opacity="0.25"/>

    <!-- floor -->
    <polygon points="0,360 0,236 640,236 640,360" fill="url(#floor)"/>
    <line x1="0" y1="236" x2="640" y2="236" stroke="#27406b" stroke-width="2"/>

    <!-- perspective floor lines -->
    <g stroke="#22375c" stroke-width="1" opacity="0.7">
        <line x1="320" y1="236" x2="40" y2="360"/>
        <line x1="320" y1="236" x2="180" y2="360"/>
        <line x1="320" y1="236" x2="460" y2="360"/>
        <line x1="320" y1="236" x2="600" y2="360"/>
        <line x1="0" y1="280" x2="640" y2="280"/>
        <line x1="0" y1="320" x2="640" y2="320"/>
    </g>

    <!-- left rack row -->
    <g fill="#0d1526" stroke="#2c4470" stroke-width="2">
        <rect x="28" y="96" width="86" height="140"/>
        <rect x="126" y="118" width="72" height="118"/>
        <rect x="208" y="140" width="58" height="96"/>
    </g>
    <!-- right rack row -->
    <g fill="#0d1526" stroke="#2c4470" stroke-width="2">
        <rect x="526" y="96" width="86" height="140"/>
        <rect x="442" y="118" width="72" height="118"/>
        <rect x="374" y="140" width="58" height="96"/>
    </g>

    <!-- rack LEDs -->
    <g>
        <circle cx="44" cy="112" r="3" fill="#34d399"/>
        <circle cx="56" cy="112" r="3" fill="#34d399"/>
        <circle cx="68" cy="112" r="3" fill="#f59e0b"/>
        <circle cx="44" cy="150" r="3" fill="#34d399"/>
        <circle cx="56" cy="150" r="3" fill="#22d3ee"/>
        <circle cx="142" cy="134" r="3" fill="#34d399"/>
        <circle cx="154" cy="134" r="3" fill="#f59e0b"/>
        <circle cx="542" cy="112" r="3" fill="#34d399"/>
        <circle cx="554" cy="112" r="3" fill="#22d3ee"/>
        <circle cx="566" cy="112" r="3" fill="#34d399"/>
        <circle cx="542" cy="150" r="3" fill="#f59e0b"/>
        <circle cx="458" cy="134" r="3" fill="#34d399"/>
        <circle cx="470" cy="134" r="3" fill="#34d399"/>
    </g>

    <!-- back wall doorway -->
    <rect x="290" y="150" width="60" height="86" fill="#0a1120" stroke="#2c4470" stroke-width="2"/>
    <rect x="304" y="168" width="32" height="18" fill="#1b2c4d"/>

    <!-- grain + vignette -->
    <rect width="640" height="360" filter="url(#grain)" opacity="0.5"/>
    <rect width="640" height="360" fill="url(#vignette)"/>
</svg>
