services:
    laravel.test:
        restart: unless-stopped
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
    vite:
        restart: unless-stopped
        image: 'sail-8.5/app'
        ports:
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        command: ['npm', 'run', 'dev', '--', '--host', '0.0.0.0', '--port', '${VITE_PORT:-5173}']
        networks:
            - sail
        depends_on:
            - laravel.test
    reverb:
        restart: unless-stopped
        image: 'sail-8.5/app'
        ports:
            - '8081:8080'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        command: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
    queue:
        restart: unless-stopped
        image: 'sail-8.5/app'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        command: ['php', 'artisan', 'queue:work', '--tries=1', '--timeout=0']
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
    phpmyadmin:
        restart: unless-stopped
        image: 'phpmyadmin:latest'
        ports:
            - '8080:80'
        environment:
            PMA_HOST: mysql
            PMA_USER: '${DB_USERNAME}'
            PMA_PASSWORD: '${DB_PASSWORD}'
            UPLOAD_LIMIT: 512M
            MEMORY_LIMIT: 512M
            MAX_EXECUTION_TIME: 600
        volumes:
            - './scripts/phpmyadmin-config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
    mysql:
        restart: unless-stopped
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            interval: 5s
            retries: 3
            timeout: 5s
            start_period: 30s
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
